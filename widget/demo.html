<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DPI-LS — live demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1280px; margin: 40px auto; padding: 0 24px;
      color: #111827; background: #f9fafb;
    }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .sub { color: #6b7280; margin: 0 0 32px; font-size: 14px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; margin: 28px 0 12px; }
    code { background: #eef2ff; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
    .row { display: grid; gap: 24px; grid-template-columns: 2fr 1fr; align-items: start; }
    @media (max-width: 900px) { .row { grid-template-columns: 1fr; } }
    .stack > * + * { margin-top: 16px; }
  </style>
  <script src="/widget/dpi-ls.js" defer></script>
</head>
<body>
  <h1>DPI-LS — live agent ratings</h1>
  <p class="sub">Embed any of these on a host page with one <code>&lt;script&gt;</code> tag. No framework.</p>

  <div class="row">
    <div>
      <h2>Board — all agents</h2>
      <dpi-ls-board poll-interval="3000"></dpi-ls-board>
    </div>
    <div class="stack">
      <div>
        <h2>Per-agent card — multi-source</h2>
        <dpi-ls-agent agent-id="agent-multi-001" poll-interval="3000"></dpi-ls-agent>
      </div>
      <div>
        <h2>SME quality capture</h2>
        <dpi-ls-sme-prompt agent-id="agent-multi-001" submitted-by="qa@example.com"></dpi-ls-sme-prompt>
      </div>
      <div>
        <h2>Settings</h2>
        <dpi-ls-settings></dpi-ls-settings>
      </div>
    </div>
  </div>
</body>
</html>
