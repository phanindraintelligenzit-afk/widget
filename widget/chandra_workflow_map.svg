<svg viewBox="0 0 1240 1560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1240" height="1560" fill="#f8fafc"/>

  <!-- Title -->
  <text x="620" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Chandra + DPI — Task In, Trusted Score Out</text>
  <text x="620" y="74" text-anchor="middle" font-size="15" fill="#64748b">Worker · Witness · Judge — three separate parties, by design</text>

  <!-- ============ INPUT ============ -->
  <rect x="420" y="100" width="400" height="64" rx="10" fill="#0f172a"/>
  <text x="620" y="127" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">TASK IN</text>
  <text x="620" y="149" text-anchor="middle" font-size="13" fill="#cbd5e1">e.g. "Reduce cloud costs in this AWS account"</text>

  <line x1="620" y1="164" x2="620" y2="204" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ CHANDRA CONTAINER ============ -->
  <rect x="90" y="210" width="1060" height="620" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="246" font-size="18" font-weight="700" fill="#1d4ed8">CHANDRA — the worker</text>
  <text x="120" y="268" font-size="13" fill="#475569">Fixed 5-step procedure (LangGraph StateGraph) — our IP. The AI cannot skip or reorder steps.</text>

  <!-- Left column: brain + toolbelt -->
  <rect x="120" y="300" width="250" height="150" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="245" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">THE BRAIN</text>
  <text x="245" y="352" text-anchor="middle" font-size="13" fill="#334155">Claude Sonnet on AWS Bedrock</text>
  <text x="245" y="372" text-anchor="middle" font-size="12" fill="#64748b">Runs inside OUR AWS account.</text>
  <text x="245" y="390" text-anchor="middle" font-size="12" fill="#64748b">Client data never leaves.</text>
  <text x="245" y="416" text-anchor="middle" font-size="12" font-style="italic" fill="#1e40af">Reasons inside each step —</text>
  <text x="245" y="433" text-anchor="middle" font-size="12" font-style="italic" fill="#1e40af">does not invent the process</text>

  <rect x="120" y="480" width="250" height="150" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="245" y="508" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">THE TOOLBELT</text>
  <text x="245" y="532" text-anchor="middle" font-size="13" fill="#334155">AWS's own APIs (boto3)</text>
  <text x="245" y="554" text-anchor="middle" font-size="12" fill="#64748b">5 KRAs: cost · security · compliance</text>
  <text x="245" y="571" text-anchor="middle" font-size="12" fill="#64748b">performance · reliability</text>
  <text x="245" y="597" text-anchor="middle" font-size="12" font-style="italic" fill="#1e40af">Never answers from memory —</text>
  <text x="245" y="614" text-anchor="middle" font-size="12" font-style="italic" fill="#1e40af">always reads live client data</text>

  <!-- Right spine: 5 steps -->
  <!-- Step 1 -->
  <rect x="470" y="292" width="620" height="82" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="505" cy="333" r="17" fill="#2563eb"/>
  <text x="505" y="339" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="540" y="322" font-size="15" font-weight="700" fill="#0f172a">CLASSIFY</text>
  <text x="540" y="344" font-size="13" fill="#475569">What kind of problem is this? → cost / security / compliance /</text>
  <text x="540" y="362" font-size="13" fill="#475569">performance / reliability</text>

  <line x1="780" y1="374" x2="780" y2="398" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="470" y="400" width="620" height="82" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="505" cy="441" r="17" fill="#2563eb"/>
  <text x="505" y="447" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="540" y="430" font-size="15" font-weight="700" fill="#0f172a">INVESTIGATE</text>
  <text x="540" y="452" font-size="13" fill="#475569">Pulls the actual facts from AWS — live bills, configs, running</text>
  <text x="540" y="470" font-size="13" fill="#475569">resources. Real numbers, this minute. No guessing.</text>

  <line x1="780" y1="482" x2="780" y2="506" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="470" y="508" width="620" height="96" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <circle cx="505" cy="556" r="17" fill="#d97706"/>
  <text x="505" y="562" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="540" y="538" font-size="15" font-weight="700" fill="#0f172a">ASSESS BLAST RADIUS — the judgment step</text>
  <text x="540" y="560" font-size="13" fill="#475569">Before acting: what breaks if I do this? Here Chandra caught that the</text>
  <text x="540" y="578" font-size="13" fill="#475569">"expensive job" was a GxP-validated genomics workload —</text>
  <text x="540" y="596" font-size="13" font-weight="600" fill="#b45309">and refused to kill it. Judgment, not automation.</text>

  <line x1="780" y1="604" x2="780" y2="628" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="470" y="630" width="620" height="78" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="505" cy="669" r="17" fill="#2563eb"/>
  <text x="505" y="675" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <text x="540" y="660" font-size="15" font-weight="700" fill="#0f172a">RECOMMEND</text>
  <text x="540" y="682" font-size="13" fill="#475569">Proposed action + full reasoning — the safe move, not just the cheap one</text>

  <line x1="780" y1="708" x2="780" y2="732" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="470" y="734" width="620" height="78" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="505" cy="773" r="17" fill="#2563eb"/>
  <text x="505" y="779" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>
  <text x="540" y="764" font-size="15" font-weight="700" fill="#0f172a">AUDIT SUMMARY</text>
  <text x="540" y="786" font-size="13" fill="#475569">Writes everything it saw, thought and decided into the work register — every task, every time</text>

  <!-- Connectors from brain/toolbelt to spine -->
  <line x1="370" y1="375" x2="466" y2="420" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowBlue)"/>
  <line x1="370" y1="555" x2="466" y2="545" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowBlue)"/>
  <line x1="370" y1="530" x2="466" y2="450" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowBlue)"/>

  <!-- ============ OUTPUTS ============ -->
  <line x1="620" y1="830" x2="620" y2="868" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="200" y="874" width="380" height="76" rx="10" fill="#0f172a"/>
  <text x="390" y="905" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">OUTPUT → to the human</text>
  <text x="390" y="928" text-anchor="middle" font-size="13" fill="#cbd5e1">Recommendation + reasoning (dashboard)</text>

  <rect x="660" y="874" width="380" height="76" rx="10" fill="#334155"/>
  <text x="850" y="905" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">RECORD → the witness</text>
  <text x="850" y="928" text-anchor="middle" font-size="13" fill="#cbd5e1">Full audit trail → Postgres / RDS work register</text>

  <!-- ============ DPI CONTAINER ============ -->
  <line x1="850" y1="950" x2="850" y2="988" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="90" y="994" width="1060" height="470" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="1030" font-size="18" font-weight="700" fill="#15803d">DPI — the judge (appraisal system)</text>
  <text x="120" y="1052" font-size="13" fill="#475569">Never asks Chandra how well it did. Reads independent evidence only. No score is typed in by hand.</text>

  <!-- Three evidence feeds -->
  <rect x="120" y="1080" width="310" height="130" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="275" y="1108" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">FEED 1 · WORK REGISTER</text>
  <text x="275" y="1130" text-anchor="middle" font-size="12.5" fill="#334155">Every task, decision, outcome</text>
  <text x="275" y="1148" text-anchor="middle" font-size="12.5" fill="#334155">Chandra logged (Postgres/RDS)</text>
  <text x="275" y="1178" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">→ P · Q · E · G · R</text>

  <rect x="465" y="1080" width="310" height="130" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="620" y="1108" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">FEED 2 · THE AWS BILL</text>
  <text x="620" y="1130" text-anchor="middle" font-size="12.5" fill="#334155">Actual $ Chandra costs to run</text>
  <text x="620" y="1148" text-anchor="middle" font-size="12.5" fill="#334155">(Cost Explorer: model + infra)</text>
  <text x="620" y="1178" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">→ C (Cost)</text>

  <rect x="810" y="1080" width="310" height="130" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="965" y="1108" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">FEED 3 · THE ANSWER KEY</text>
  <text x="965" y="1130" text-anchor="middle" font-size="12.5" fill="#334155">Were recommendations actually</text>
  <text x="965" y="1148" text-anchor="middle" font-size="12.5" fill="#334155">correct vs ground truth?</text>
  <text x="965" y="1178" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">→ V (Validation)</text>

  <!-- feeds to engine -->
  <line x1="275" y1="1210" x2="560" y2="1266" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="620" y1="1210" x2="620" y2="1264" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="965" y1="1210" x2="680" y2="1266" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Engine -->
  <rect x="330" y="1270" width="580" height="86" rx="10" fill="#15803d"/>
  <text x="620" y="1300" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">DPI ENGINE — connectors pull, formula computes</text>
  <text x="620" y="1326" text-anchor="middle" font-size="15" font-family="Consolas, monospace" fill="#bbf7d0">PI = (P × Q × 1.5E) + (G × 1.5R) + (C × V)</text>
  <text x="620" y="1346" text-anchor="middle" font-size="12" fill="#dcfce7">Weights configurable per client · 276 passing tests</text>

  <line x1="620" y1="1356" x2="620" y2="1382" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Scoreboard -->
  <rect x="400" y="1386" width="440" height="60" rx="10" fill="#0f172a"/>
  <text x="620" y="1412" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">DPI SCOREBOARD</text>
  <text x="620" y="1434" text-anchor="middle" font-size="13" fill="#cbd5e1">Scores · Connectors · Formula tabs — one trusted number</text>

  <!-- Footer -->
  <text x="620" y="1510" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Worker (Chandra) · Witness (logs + AWS) · Judge (DPI) — separated by design.</text>
  <text x="620" y="1534" text-anchor="middle" font-size="13" fill="#64748b">That separation is why a buyer can trust the score — and why this is a product, not a project.</text>
</svg>
