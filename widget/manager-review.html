<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manager Review</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #00051e; --surface: #0a0f2b; --surface2: #141938;
      --border: #1e2345; --accent: #facc15; --green: #10b981;
      --text: #ffffff; --muted: #a1a1aa;
    }
    body {
      font-family: 'Inter', sans-serif;
      max-width: 1400px; margin: 0 auto; padding: 0 0 40px;
      color: var(--text); background: var(--bg);
    }
    .top-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      display: flex; align-items: center; gap: 32px;
      height: 56px; margin-bottom: 32px;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo {
      font-weight: 800; font-size: 16px;
      background: linear-gradient(135deg, #facc15, #eab308);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-decoration: none;
    }
    .page-body { padding: 0 24px; max-width: 800px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
    input, textarea, select {
      width: 100%; padding: 10px; background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; font-family: inherit;
    }
    button {
      background: var(--accent); color: #000; padding: 10px 20px;
      border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
      margin-top: 20px;
    }
    button:hover { opacity: 0.9; }
    .status-msg { margin-top: 16px; font-size: 14px; }
    .success { color: var(--green); }
    .error { color: #ef4444; }
  
    input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px var(--surface) inset !important;
        -webkit-text-fill-color: var(--text) !important;
        transition: background-color 5000s ease-in-out 0s;
    }
</style>
</head>
<body>
  <nav class="top-nav">
    <a href="/widget/demo.html" class="nav-logo" style="display: flex; align-items: center;">
      <img src="intelligenz-logo.png" alt="Intelligenz IT Logo" style="height: 32px;">
    </a>
    <span style="color:var(--muted)">Manager Review</span>
  </nav>
  <div class="page-body">
    <h1>Digital Worker Performance Review</h1>
    <form id="managerForm">
      <div class="form-group">
        <label>Agent ID</label>
        <input type="text" id="agent_id" required>
      </div>
      <div class="form-group">
        <label>Business Owner Email (Required for authorization)</label>
        <input type="email" id="manager_id" required placeholder="name@company.com">
      </div>
      <div class="form-group">
        <label>Review Period (e.g. Q1 2026)</label>
        <input type="text" id="review_period">
      </div>
      <div class="form-group">
        <label>Overall Rating (1 to 5)</label>
        <select id="rating" required>
          <option value="">Select Rating</option>
          <option value="1">1 - Needs Improvement</option>
          <option value="2">2 - Below Expectations</option>
          <option value="3">3 - Meets Expectations</option>
          <option value="4">4 - Exceeds Expectations</option>
          <option value="5">5 - Outstanding</option>
        </select>
      </div>
      <div class="form-group">
        <label>Comments / Improvement Plan</label>
        <textarea id="comments" rows="4"></textarea>
      </div>
      <button type="submit">Submit Review</button>
      <div id="status" class="status-msg"></div>
    </form>
  </div>

  <script>
    document.getElementById('managerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const agentId = document.getElementById('agent_id').value;
      const payload = {
        manager_id: document.getElementById('manager_id').value,
        review_period: document.getElementById('review_period').value,
        rating: parseInt(document.getElementById('rating').value),
        comments: document.getElementById('comments').value,
      };
      
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Submitting...';
      statusEl.className = 'status-msg';

      try {
        const res = await fetch(`/api/agents/${agentId}/manager-rating`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          statusEl.innerHTML = 'Review submitted successfully!<br><br><div style="background:#1a1b26; padding:15px; border-radius:8px; border:1px solid #2f334d; font-size:14px; text-align:left;"><span style="color:#4ade80;">&#10003; <b>Intelligenz IT Pvt Limited</b><br>Notification has been dispatched to Business & Technical Owners via SMTP!</span></div><br><span style="color:var(--muted)">Redirecting to Agent Profile...</span>';
          statusEl.classList.add('success');
          setTimeout(() => {
              window.location.href = '/widget/agent-profile.html?id=' + encodeURIComponent(agentId);
          }, 3000);
        } else {
          const err = await res.json();
          statusEl.textContent = 'Error: ' + (err.detail || 'Unknown error');
          statusEl.classList.add('error');
        }
      } catch (err) {
        statusEl.textContent = 'Network Error: ' + err.message;
        statusEl.classList.add('error');
      }
    });
  </script>
</body>
</html>
