<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manager Review</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
      --border: #2d3148; --accent: #6366f1; --green: #10b981;
      --text: #f1f5f9; --muted: #94a3b8;
    }
    body {
      font-family: 'Inter', sans-serif;
      max-width: 1400px; margin: 0 auto; padding: 0 0 40px;
      color: var(--text); background: var(--bg);
    }
    .top-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      display: flex; align-items: center; gap: 32px;
      height: 56px; margin-bottom: 32px;
    }
    .nav-logo {
      font-weight: 800; font-size: 16px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-decoration: none;
    }
    .page-body { padding: 0 24px; max-width: 800px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
    input, textarea, select {
      width: 100%; padding: 10px; background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; font-family: inherit;
    }
    button {
      background: var(--accent); color: white; padding: 10px 20px;
      border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
      margin-top: 20px;
    }
    button:hover { opacity: 0.9; }
    .status-msg { margin-top: 16px; font-size: 14px; }
    .success { color: var(--green); }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="/widget/demo.html" class="nav-logo">DPI-LS</a>
    <span style="color:var(--muted)">Manager Review</span>
  </nav>
  <div class="page-body">
    <h1>Digital Worker Performance Review</h1>
    <form id="managerForm">
      <div class="form-group">
        <label>Agent ID</label>
        <input type="text" id="agent_id" required>
      </div>
      <div class="form-group">
        <label>Your Manager ID / Email</label>
        <input type="text" id="manager_id" required>
      </div>
      <div class="form-group">
        <label>Review Period (e.g. Q1 2026)</label>
        <input type="text" id="review_period">
      </div>
      <div class="form-group">
        <label>Overall Rating (1 to 5)</label>
        <select id="rating" required>
          <option value="">Select Rating</option>
          <option value="1">1 - Needs Improvement</option>
          <option value="2">2 - Below Expectations</option>
          <option value="3">3 - Meets Expectations</option>
          <option value="4">4 - Exceeds Expectations</option>
          <option value="5">5 - Outstanding</option>
        </select>
      </div>
      <div class="form-group">
        <label>Comments / Improvement Plan</label>
        <textarea id="comments" rows="4"></textarea>
      </div>
      <button type="submit">Submit Review</button>
      <div id="status" class="status-msg"></div>
    </form>
  </div>

  <script>
    document.getElementById('managerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const agentId = document.getElementById('agent_id').value;
      const payload = {
        manager_id: document.getElementById('manager_id').value,
        review_period: document.getElementById('review_period').value,
        rating: parseInt(document.getElementById('rating').value),
        comments: document.getElementById('comments').value,
      };
      
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Submitting...';
      statusEl.className = 'status-msg';

      try {
        const res = await fetch(`/api/agents/${agentId}/manager-rating`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          const data = await res.json();
          let logsHtml = '';
          if (data.logs) {
            logsHtml = `
              <div style="margin-top:20px; text-align:left; background:#000; padding:15px; border-radius:6px; overflow-x:auto; max-height:400px; overflow-y:auto;">
                <h4 style="color:#94a3b8; margin-bottom:10px; font-family:monospace;">Terminal Output:</h4>
                <pre style="color:#10b981; font-family:monospace; font-size:12px; white-space:pre-wrap;">${data.logs}</pre>
              </div>
            `;
          }
          statusEl.innerHTML = `Manager review submitted successfully! <br><br><a href="/widget/demo.html" style="color:var(--accent); text-decoration:underline;">View Dashboard &rarr;</a>${logsHtml}`;
          statusEl.classList.add('success');
        } else {
          const err = await res.json();
          statusEl.textContent = 'Error: ' + (err.detail || 'Unknown error');
          statusEl.classList.add('error');
        }
      } catch (err) {
        statusEl.textContent = 'Network Error';
        statusEl.classList.add('error');
      }
    });
  </script>
</body>
</html>
