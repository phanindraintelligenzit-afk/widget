[project]
name = "dpi-ls"
version = "0.3.0"
description = "Digital FTE Performance Index — engine + embeddable widget + 2-line installable monitor() entrypoint"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "langgraph>=0.2",
    "uvicorn>=0.49.0",
    "python-dotenv>=1.2.2",
    "langchain-aws>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=0.3",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-semantic-conventions>=0.63b1",
    "opentelemetry-instrumentation-langchain>=0.61.0",
    "opentelemetry-instrumentation-requests>=0.63b1",
    "opentelemetry-instrumentation-botocore>=0.63b1",
    "aioboto3>=7.0.0",
    "openai-agents>=0.17.4",
    "litellm>=1.50.0",
    "httpx>=0.27",
    "crewai>=1.6.1",
    "pyautogen>=0.10.0",
    "llama-index>=0.14.22",
    "arize-otel>=0.13.0",
    "openinference-instrumentation-crewai>=1.1.9",
    "openinference-instrumentation-litellm>=0.1.34",
    "openinference-instrumentation-bedrock>=0.1.41",
    "openinference-instrumentation-langchain>=0.1.66",
    "arize-phoenix>=17.6.0",
    "agentops>=0.4.21",
    "traceloop-sdk>=0.61.0",
    "langfuse>=4.9.0",
    "langchain>=1.3.9",
    "trulens>=2.8.1",
    "trulens-providers-bedrock>=2.8.1",
    "trulens-apps-langchain>=2.8.1",
    "requests>=2.34.2",
    "detect-secrets>=1.5.0",
    "sentence-transformers>=5.6.0",
    "chromadb>=1.1.1",
    "llm-guard>=0.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "respx>=0.21"]
# LlamaIndex support — installs llama-index-core so the LlamaIndexPatcher
# can be used. The patcher's import is lazy so the base package still
# imports cleanly without this.
llamaindex = ["llama-index-core>=0.10"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "dpi_ls*",
    "api*",
    "contract*",
    "engine*",
    "ingestion*",
    "store*",
    "widget*",
]
exclude = [
    "tests*",
    "fixtures*",
    "scripts*",
    "observation*",
    "database*",
    "sandbox_*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
