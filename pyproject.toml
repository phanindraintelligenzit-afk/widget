[project]
name = "dpi-ls"
version = "0.3.0"
description = "Digital FTE Performance Index — engine + embeddable widget + 2-line installable monitor() entrypoint"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "langgraph>=0.2",
    "uvicorn>=0.49.0",
    "python-dotenv>=1.2.2",
    "langchain-aws>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=0.3",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-semantic-conventions>=0.63b1",
    "opentelemetry-instrumentation-langchain>=0.61.0",
    "opentelemetry-instrumentation-requests>=0.63b1",
    "opentelemetry-instrumentation-botocore>=0.63b1",
    "aioboto3>=7.0.0",
    "openai-agents>=0.17.4",
    "litellm>=1.87.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "dpi_ls*",
    "api*",
    "contract*",
    "engine*",
    "ingestion*",
    "store*",
    "widget*",
]
exclude = [
    "tests*",
    "fixtures*",
    "scripts*",
    "observation*",
    "database*",
    "sandbox_*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
