[project]
name = "dpi-ls"
version = "0.0.1"
description = "Digital FTE Performance Index — engine + embeddable widget"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "langgraph>=0.2",
    "uvicorn>=0.49.0",
    "python-dotenv>=1.2.2",
    "langchain-aws>=1.5.0",
    "langchain-community>=0.4.2",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-semantic-conventions>=0.63b1",
    "opentelemetry-instrumentation-langchain>=0.61.0",
    "opentelemetry-instrumentation-requests>=0.63b1",
    "opentelemetry-instrumentation-botocore>=0.63b1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
