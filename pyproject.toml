[project]
name = "dpi-ls"
version = "0.0.1"
description = "Digital FTE Performance Index — engine + embeddable widget"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
